name: Code Review Automation

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

jobs:
  code-quality:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run linting
      run: npm run build 2>&1 | tee build-output.log
      
    - name: Run tests
      run: npm test -- --coverage --watchAll=false
      
    - name: Check for TypeScript errors (if applicable)
      run: |
        if [ -f "tsconfig.json" ]; then
          npx tsc --noEmit
        else
          echo "No TypeScript configuration found, skipping type check"
        fi
      
    - name: Build project
      run: npm run build
      
    - name: Check bundle size
      run: |
        npm run build
        BUILD_SIZE=$(du -sh build/ | cut -f1)
        echo "Build size: $BUILD_SIZE"
        # Add bundle size check logic here if needed
        
    - name: Upload coverage reports
      if: matrix.node-version == '20.x'
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage/lcov.info
        fail_ci_if_error: false

  security-check:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run security audit
      run: npm audit --audit-level=high
      
    - name: Check for known vulnerabilities
      run: npx audit-ci --moderate

  accessibility-check:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build project
      run: npm run build
      
    - name: Serve built app and run accessibility tests
      run: |
        npm install -g serve
        serve -s build -p 3000 &
        sleep 10
        # Add accessibility testing tool here (e.g., axe-core, pa11y)
        echo "Accessibility tests would run here"

  code-review-checklist:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Validate code review files exist
      run: |
        if [ ! -f "CODE_REVIEW.md" ]; then
          echo "❌ CODE_REVIEW.md file is missing"
          exit 1
        fi
        
        if [ ! -f ".github/PULL_REQUEST_TEMPLATE/pull_request_template.md" ]; then
          echo "❌ Pull request template is missing"
          exit 1
        fi
        
        echo "✅ Code review documentation is in place"
        
    - name: Check PR description completeness
      if: github.event_name == 'pull_request'
      run: |
        PR_BODY="${{ github.event.pull_request.body }}"
        
        if [[ -z "$PR_BODY" ]]; then
          echo "❌ PR description is empty. Please use the PR template."
          exit 1
        fi
        
        # Check for required sections
        if [[ "$PR_BODY" == *"Type of Change"* ]]; then
          echo "✅ PR includes type of change"
        else
          echo "⚠️  PR should specify type of change"
        fi
        
        if [[ "$PR_BODY" == *"Testing"* ]]; then
          echo "✅ PR includes testing information"
        else
          echo "⚠️  PR should include testing information"
        fi
        
        echo "✅ PR description validation complete"